name: Kubernetes CD

on:
  push:
    branches:
      - v2-development

jobs:
  deploy-k8s:
    runs-on: [self-hosted, Linux, X64, ems, production]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Set image
        run: echo "IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Deploy EMS to Kubernetes
        run: |
          kubectl set image deployment/ems ems="$IMAGE"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/ems --timeout=180s

      - name: Health check
        run: |
          URL=$(minikube service ems --url)
          curl --fail --retry 10 --retry-delay 5 "$URL/actuator/health"
